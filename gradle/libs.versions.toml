[versions]
paper-api = "26.2.build.+"
minecraft = "26.2"
protocollib = "5.4.0"
junit = "5.13.4"
sqlite-jdbc = "3.50.3.0"
mockito = "5.18.0"

run-task = "3.0.2"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper-api" }
protocollib = { module = "net.dmulloy2:ProtocolLib", version.ref = "protocollib" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }

[plugins]
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run-task" }
